name: Resume PDF

# Prints /resume with headless Chrome, checks that resume parsers read the
# result correctly (scripts/check-resume-pdf.py), and commits it to
# public/amey-pawar-resume.pdf when its text changed. Never edit that PDF by
# hand: change src/data/resume.ts instead.

on:
  push:
    paths-ignore:
      - public/amey-pawar-resume.pdf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pdfminer.six

      - run: npm ci
      - run: npm run build

      - name: Start the site
        run: |
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/resume > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1

      - name: Print /resume
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf=/tmp/resume.pdf http://localhost:3000/resume

      - name: Check the PDF
        run: python scripts/check-resume-pdf.py /tmp/resume.pdf

      - name: Commit the PDF if its text changed
        run: |
          new=$(pdftotext /tmp/resume.pdf - | sha256sum)
          old=$(pdftotext public/amey-pawar-resume.pdf - 2>/dev/null | sha256sum)
          if [ "$new" = "$old" ]; then
            echo "Text unchanged; keeping the committed PDF."
            exit 0
          fi
          cp /tmp/resume.pdf public/amey-pawar-resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/amey-pawar-resume.pdf
          git commit -m "Regenerate resume PDF"
          git push
